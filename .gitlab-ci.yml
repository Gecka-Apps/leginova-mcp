stages:
  - test
  - live

.node:
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline

test:
  extends: .node
  stage: test
  image: node:${NODE_VERSION}
  parallel:
    matrix:
      - NODE_VERSION: ["22", "24", "26"]
  script:
    - npm run typecheck
    - npm test
    - npm run build
    - npx mcpb validate manifest.json

live:
  extends: .node
  stage: live
  image: node:24
  allow_failure: true
  script:
    - npm run build
    - npm run test:live
