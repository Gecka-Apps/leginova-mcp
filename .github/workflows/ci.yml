name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node scripts/version.mjs check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  extension:
    name: Claude Desktop extension
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run pack:mcpb
      - uses: actions/upload-artifact@v7
        with:
          name: leginova-mcpb-${{ github.sha }}
          path: |
            leginova-*.mcpb
            dist/leginova-mcp.mjs
          if-no-files-found: error
          retention-days: 30

  live:
    name: Live tests against leginova.gouv.nc
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:live
